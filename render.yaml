services:
  - type: web
    name: yoshlarhub
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT --timeout 60
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: SITE_NAME
        value: Yoshlar Hub
      - key: PYTHON_VERSION
        value: 3.12.7
