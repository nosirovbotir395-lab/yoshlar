<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yoshlar Hub — Imkoniyatlar</title>
<style>
  :root{
    --bg:#F5F7FA; --white:#FFFFFF; --text:#172B4D; --muted:#667085;
    --primary:#155EEF; --primary-dark:#1248C0; --green:#12B76A;
    --orange:#F79009; --purple:#7F56D9; --border:#E4E7EC;
    --soft-blue:#EEF4FF; --soft-green:#ECFDF3; --soft-orange:#FFFAEB;
    --soft-purple:#F9F5FF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
  }
  button{font-family:inherit;cursor:pointer;border:none}

  /* HEADER */
  header{
    background:var(--white); border-bottom:1px solid var(--border);
    height:70px; display:flex; align-items:center; padding:0 25px;
    position:sticky; top:0; z-index:50;
  }
  .brand{display:flex;align-items:center;gap:10px}
  .logo{
    width:38px;height:38px;border-radius:50%;background:var(--primary);
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-weight:bold;font-size:18px;
  }
  .brand h1{font-size:17px;font-weight:700}
  .tagline{color:var(--muted);font-size:13px;margin-left:25px}
  .user{margin-left:auto;display:flex;align-items:center;gap:8px}
  .user .avatar{
    width:34px;height:34px;background:var(--soft-blue);color:var(--primary);
    border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:bold;
  }

  /* LAYOUT */
  .layout{display:flex;min-height:calc(100vh - 70px)}
  aside{
    background:var(--white);width:230px;border-right:1px solid var(--border);
    padding:25px 10px;flex-shrink:0;
  }
  .aside-label{
    color:#98A2B3;font-size:11px;font-weight:700;letter-spacing:.5px;
    padding:0 10px;margin-bottom:10px;margin-top:10px;
  }
  .nav-btn{
    display:flex;align-items:center;gap:10px;width:100%;
    padding:11px 14px;background:transparent;color:#475467;
    font-size:14px;border-radius:6px;text-align:left;
    transition:background .15s;
  }
  .nav-btn:hover{background:var(--soft-blue);color:var(--primary)}
  .nav-btn.active{
    background:var(--soft-blue);color:var(--primary);font-weight:700;
  }
  .status{
    margin-top:25px;padding:12px 10px;border-top:1px solid var(--border);
    font-size:12px;color:var(--muted);line-height:1.5;
  }

  main{flex:1;padding:30px 35px;overflow-y:auto}

  h2.page-title{font-size:24px;font-weight:700;margin-bottom:6px}
  .page-sub{color:var(--muted);font-size:14px;margin-bottom:22px}

  /* SEARCH BAR */
  .search-bar{
    background:var(--white);border:1px solid var(--border);border-radius:8px;
    display:flex;align-items:center;padding:0 8px;margin-bottom:22px;
  }
  .search-bar input{
    flex:1;border:none;outline:none;padding:14px 10px;font-size:14px;
    background:transparent;color:var(--text);font-family:inherit;
  }
  .search-bar .icon{padding:0 10px;color:var(--muted);font-size:18px}

  /* BUTTONS */
  .btn{
    padding:9px 16px;border-radius:6px;font-size:13px;font-weight:600;
    transition:opacity .15s;color:#fff;background:var(--primary);
  }
  .btn:hover{opacity:.9}
  .btn.green{background:var(--green)}
  .btn.orange{background:var(--orange)}
  .btn.white{background:#fff;color:var(--primary)}
  .btn.outline{background:transparent;color:var(--primary);border:1px solid var(--primary)}

  /* STATS */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
  .stat{
    background:var(--white);border:1px solid var(--border);border-radius:8px;
    padding:16px 18px;
  }
  .stat .value{font-size:22px;font-weight:700;margin-bottom:2px}
  .stat .label{color:var(--muted);font-size:12px}

  /* BANNER */
  .banner{
    background:var(--primary);color:#fff;border-radius:8px;
    padding:22px 24px;display:flex;justify-content:space-between;
    align-items:center;gap:16px;margin-bottom:26px;
  }
  .banner h3{font-size:17px;margin-bottom:5px}
  .banner p{font-size:13px;opacity:.9}
  .banner .small{font-size:11px;letter-spacing:.5px;opacity:.8;font-weight:700}

  /* SECTION */
  .section-title{font-size:16px;font-weight:700;margin-bottom:4px}
  .section-sub{font-size:12px;color:var(--muted);margin-bottom:14px}

  /* CARDS GRID */
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
  .card{
    background:var(--white);border:1px solid var(--border);border-radius:8px;
    padding:15px;transition:box-shadow .15s;
  }
  .card:hover{box-shadow:0 4px 14px rgba(0,0,0,.05)}
  .badges{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  .badge{
    font-size:10px;font-weight:700;padding:3px 8px;border-radius:4px;
    text-transform:uppercase;letter-spacing:.3px;
  }
  .badge.new{background:var(--green);color:#fff}
  .badge.deadline{margin-left:auto;color:var(--muted);font-weight:400;text-transform:none;font-size:11px}
  .card h3{font-size:14px;margin-bottom:6px;line-height:1.35}
  .card p{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:10px}
  .card .more{
    background:none;color:var(--primary);font-size:12px;font-weight:700;
    padding:0;
  }
  .card .more:hover{color:var(--primary-dark)}

  /* LIST CARDS */
  .list-card{
    background:var(--white);border:1px solid var(--border);border-radius:8px;
    padding:15px;display:flex;gap:15px;margin-bottom:10px;align-items:flex-start;
  }
  .list-card .cat-icon{
    width:52px;height:52px;border-radius:8px;display:flex;align-items:center;
    justify-content:center;font-size:22px;font-weight:700;flex-shrink:0;
  }
  .list-card .content{flex:1;min-width:0}
  .list-card h3{font-size:15px;margin-bottom:5px;line-height:1.3}
  .list-card .meta{font-size:11px;color:var(--muted);margin-bottom:6px}
  .list-card .fields{font-size:11px;color:#475467}
  .list-card .actions{flex-shrink:0}

  /* TOOLBAR */
  .toolbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  .toolbar select,.toolbar input{
    padding:9px 12px;border:1px solid var(--border);border-radius:6px;
    font-size:13px;font-family:inherit;background:var(--white);color:var(--text);
    outline:none;
  }
  .toolbar input{flex:1;min-width:180px}

  /* FORM */
  .form-card{
    background:var(--white);border:1px solid var(--border);border-radius:8px;
    padding:25px;max-width:780px;
  }
  .form-row{display:flex;gap:12px;align-items:center;margin-bottom:12px}
  .form-row label{
    width:130px;font-size:13px;font-weight:600;flex-shrink:0;
  }
  .form-row input,.form-row select,.form-row textarea{
    flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:6px;
    font-size:13px;font-family:inherit;background:#F9FAFB;color:var(--text);
    outline:none;
  }
  .form-row textarea{min-height:70px;resize:vertical}
  .form-actions{margin-top:18px}

  /* DETAIL */
  .detail-card{
    background:var(--white);border:1px solid var(--border);border-radius:8px;
    padding:25px;max-width:900px;
  }
  .detail-card h2{font-size:22px;margin:14px 0 18px;line-height:1.3}
  .detail-info{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
  .detail-info .box{
    background:#F8FAFC;padding:10px 14px;border-radius:6px;
  }
  .detail-info .box .k{font-size:11px;color:var(--muted);margin-bottom:2px}
  .detail-info .box .v{font-size:13px;font-weight:600}
  .detail-actions{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}

  /* EMPTY */
  .empty{
    background:var(--white);border:1px solid var(--border);border-radius:8px;
    padding:45px 20px;text-align:center;
  }
  .empty h3{font-size:16px;margin-bottom:6px}
  .empty p{color:var(--muted);font-size:13px}

  .back-btn{
    background:none;color:var(--muted);font-size:13px;font-weight:700;
    padding:6px 0;margin-bottom:14px;
  }
  .back-btn:hover{color:var(--text)}

  .toast{
    position:fixed;bottom:24px;right:24px;background:var(--text);color:#fff;
    padding:12px 18px;border-radius:8px;font-size:13px;opacity:0;
    transform:translateY(10px);transition:all .25s;z-index:100;
  }
  .toast.show{opacity:1;transform:translateY(0)}

  @media(max-width:820px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .grid-2{grid-template-columns:1fr}
    aside{display:none}
    .tagline{display:none}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">Y</div>
    <h1>Yoshlar Hub</h1>
  </div>
  <div class="tagline">Imkoniyatlarni toping. O‘zingizni rivojlantiring.</div>
  <div class="user">
    <div class="avatar" id="userAvatar">P</div>
    <span id="userName" style="font-size:13px;font-weight:700">Profil</span>
  </div>
</header>

<div class="layout">
  <aside>
    <div class="aside-label">ASOSIY</div>
    <button class="nav-btn" data-page="home">⌂ Bosh sahifa</button>
    <button class="nav-btn" data-page="opportunities">◈ Imkoniyatlar</button>
    <button class="nav-btn" data-page="recommended">✦ Menga mos</button>
    <button class="nav-btn" data-page="saved">☆ Saqlanganlar</button>
    <div class="aside-label" style="margin-top:20px">SHAXSIY</div>
    <button class="nav-btn" data-page="profile">○ Mening profilim</button>
    <button class="nav-btn" data-page="add">+ Imkoniyat qo‘shish</button>
    <button class="nav-btn" data-page="sources">⚙ Manbalar</button>
    <div class="status" id="statusBox">● Ma’lumotlar yuklandi</div>
  </aside>

  <main id="main"></main>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   MA'LUMOTLAR
   ========================================================= */
const SRC_SEARCH = "Web qidiruv";
const SRC_MANUAL = "Qo‘lda qo‘shilgan";
const SRC_OFFICIAL = "Rasmiy manba (gov.uz)";

const CATEGORIES = ["Barchasi","Grantlar","Ish va internship",
  "Tanlovlar","Kurslar","Volunteer","Tadbirlar"];

const OFFICIAL_SOURCES = [
  {
    id: 1, title: "Yoshlar uchun grant va tanlovlar",
    category: "Grantlar", location: "O‘zbekiston",
    type: "Grant / tanlov", deadline: "Manbada tekshiriladi",
    fields: ["Yoshlar","Loyiha","Innovatsiya"],
    link: "https://www.google.com/search?q=O%27zbekiston+yoshlar+grant+tanlov",
    source: SRC_SEARCH, published: "",
    description: "O‘zbekiston yoshlari uchun grant, loyiha va tanlov imkoniyatlarini web orqali topish uchun boshlang‘ich manba."
  },
  {
    id: 2, title: "Talabalar uchun internship imkoniyatlari",
    category: "Ish va internship", location: "O‘zbekiston / Online",
    type: "Internship", deadline: "Manbada tekshiriladi",
    fields: ["Talabalar","Internship","Ish"],
    link: "https://www.google.com/search?q=Uzbekistan+students+internship",
    source: SRC_SEARCH, published: "",
    description: "Talabalar va yoshlar uchun amaliyot hamda boshlang‘ich ish imkoniyatlarini topish uchun qidiruv manbasi."
  },
  {
    id: 3, title: "IT va raqamli ko‘nikmalar kurslari",
    category: "Kurslar", location: "Online",
    type: "Kurs", deadline: "Doimiy",
    fields: ["IT","Dasturlash","Raqamli ko‘nikmalar"],
    link: "https://www.google.com/search?q=Uzbekistan+free+IT+courses+youth",
    source: SRC_SEARCH, published: "",
    description: "IT, dasturlash va raqamli ko‘nikmalar bo‘yicha bepul yoki ochiq kurslarni topish uchun qidiruv manbasi."
  },
  {
    id: 4, title: "Yoshlar uchun volunteer imkoniyatlari",
    category: "Volunteer", location: "O‘zbekiston / Online",
    type: "Volunteer", deadline: "Manbada tekshiriladi",
    fields: ["Volunteer","Ijtimoiy loyiha","Yoshlar"],
    link: "https://www.google.com/search?q=Uzbekistan+youth+volunteer+opportunities",
    source: SRC_SEARCH, published: "",
    description: "Yoshlar uchun ko‘ngillilik va ijtimoiy loyihalardagi imkoniyatlarni topish uchun qidiruv manbasi."
  },
  {
    id: 5, title: "Yoshlar tanlovlari va hackathonlar",
    category: "Tanlovlar", location: "O‘zbekiston / Online",
    type: "Tanlov", deadline: "Manbada tekshiriladi",
    fields: ["Hackathon","Startap","Innovatsiya"],
    link: "https://www.google.com/search?q=Uzbekistan+youth+hackathon+competition",
    source: SRC_SEARCH, published: "",
    description: "Hackathon, startap, innovatsion va yoshlar tanlovlarini topish uchun qidiruv manbasi."
  },
  {
    id: 6, title: "Yoshlar ishlari agentligi — Imkoniyatlar",
    category: "Tanlovlar", location: "O‘zbekiston",
    type: "Rasmiy bo‘lim", deadline: "Sahifada tekshiriladi",
    fields: ["Yoshlar","Imkoniyatlar"],
    link: "https://gov.uz/oz/yoshlar/sections/imkoniyatlar",
    source: SRC_OFFICIAL, published: "",
    description: "Yoshlar ishlari agentligining rasmiy “Imkoniyatlar” bo‘limi. Yangi e’lonlarni shu sahifada tekshiring."
  },
  {
    id: 7, title: "Yoshlar ishlari agentligi — Tanlovlar",
    category: "Tanlovlar", location: "O‘zbekiston",
    type: "Rasmiy bo‘lim", deadline: "Sahifada tekshiriladi",
    fields: ["Yoshlar","Tanlov"],
    link: "https://gov.uz/oz/yoshlar/contest",
    source: SRC_OFFICIAL, published: "",
    description: "Agentlik e’lon qilgan tanlovlar ro‘yxati (rasmiy sahifa)."
  },
  {
    id: 8, title: "Yoshlar ishlari agentligi — Bo‘sh ish o‘rinlari",
    category: "Ish va internship", location: "O‘zbekiston",
    type: "Rasmiy bo‘lim", deadline: "Sahifada tekshiriladi",
    fields: ["Ish","Yoshlar"],
    link: "https://gov.uz/oz/yoshlar/sections/vakansiya",
    source: SRC_OFFICIAL, published: "",
    description: "Agentlik va uning tizimidagi tashkilotlarning rasmiy vakansiyalar sahifasi."
  },
  {
    id: 9, title: "Yoshlar ishlari agentligi — Voqealar taqvimi",
    category: "Tadbirlar", location: "O‘zbekiston",
    type: "Rasmiy bo‘lim", deadline: "Sahifada tekshiriladi",
    fields: ["Yoshlar","Tadbir"],
    link: "https://gov.uz/oz/yoshlar/news/events",
    source: SRC_OFFICIAL, published: "",
    description: "Yaqinlashayotgan yoshlar tadbirlari taqvimi (rasmiy sahifa)."
  }
];

/* =========================================================
   STORAGE
   ========================================================= */
const LS_KEY = "yoshlar_hub_state_v1";

function defaultState(){
  return {
    opportunities: OFFICIAL_SOURCES.map(x => ({...x, seen: true})),
    saved_ids: [],
    profile: {},
    feeds: []
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return defaultState();
    const s = JSON.parse(raw);
    return {
      opportunities: s.opportunities?.length ? s.opportunities : defaultState().opportunities,
      saved_ids: Array.isArray(s.saved_ids) ? s.saved_ids : [],
      profile: s.profile || {},
      feeds: Array.isArray(s.feeds) ? s.feeds : []
    };
  }catch(e){ return defaultState(); }
}

function saveState(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
}

/* =========================================================
   STATE
   ========================================================= */
let state = loadState();
let currentPage = "home";
let currentCategory = "Barchasi";
let currentSearch = null;
let lastDetail = null;

/* =========================================================
   YORDAMCHILAR
   ========================================================= */
function $(sel, root=document){ return root.querySelector(sel); }
function $$(sel, root=document){ return [...root.querySelectorAll(sel)]; }
function esc(s){ return (s||"").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c])); }

function ago(published){
  if(!published) return "manbada tekshiriladi";
  const dt = new Date(published.replace(" ", "T") + "Z");
  if(isNaN(dt)) return published;
  const mins = Math.floor((Date.now() - dt.getTime())/60000);
  if(mins < 1) return "hozirgina";
  if(mins < 60) return mins + " daqiqa oldin";
  if(mins < 1440) return Math.floor(mins/60) + " soat oldin";
  const d = Math.floor(mins/1440);
  return d < 30 ? d + " kun oldin" : published.slice(0,10);
}

function catColors(cat){
  const m = {
    "Grantlar": ["#7F56D9","#F9F5FF"],
    "Ish va internship": ["#155EEF","#EEF4FF"],
    "Tanlovlar": ["#F79009","#FFFAEB"],
    "Kurslar": ["#12B76A","#ECFDF3"],
    "Volunteer": ["#039855","#ECFDF3"],
    "Tadbirlar": ["#B54708","#FFFAEB"]
  };
  return m[cat] || ["#155EEF","#EEF4FF"];
}
function catIcon(cat){
  const m = {"Grantlar":"₲","Ish va internship":"↗","Tanlovlar":"★",
    "Kurslar":"▣","Volunteer":"♥","Tadbirlar":"◷"};
  return m[cat] || "•";
}

function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove("show"), 2200);
}

function setStatus(text, color="var(--muted)"){
  const el = $("#statusBox");
  if(el){ el.textContent = text; el.style.color = color; }
}

function updateUser(){
  const name = (state.profile["Ism"] || "").trim();
  $("#userName").textContent = name || "Profil";
  $("#userAvatar").textContent = (name[0] || "P").toUpperCase();
}

/* =========================================================
   NAV
   ========================================================= */
function navigate(page){
  currentPage = page;
  if(page !== "opportunities") currentSearch = null;
  $$(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.page === page));
  const main = $("#main");
  main.innerHTML = "";
  ({
    home: renderHome,
    opportunities: renderOpportunities,
    recommended: renderRecommended,
    saved: renderSaved,
    profile: renderProfile,
    add: renderAdd,
    sources: renderSources,
    detail: renderDetail
  }[page] || renderHome)(main);
  main.scrollTop = 0;
}

$$(".nav-btn").forEach(b => b.onclick = () => navigate(b.dataset.page));

/* =========================================================
   RENDER: HOME
   ========================================================= */
function renderHome(main){
  const total = state.opportunities.length;
  const newCount = state.opportunities.filter(x => x.seen === false).length;
  const grants = state.opportunities.filter(x => x.category === "Grantlar").length;
  const saved = state.saved_ids.length;

  const interest = (state.profile["Qiziqish"] || "").trim();

  main.innerHTML = `
    <h2 class="page-title">Yangi imkoniyatlar shu yerdan boshlanadi</h2>
    <p class="page-sub">Grantlar, kurslar, tanlovlar, internship va boshqa imkoniyatlarni bir joydan toping.</p>

    <div class="search-bar">
      <span class="icon">⌕</span>
      <input id="homeSearch" placeholder="Nima izlayapsiz? Masalan: grant, logistika, IT..." />
      <button class="btn" id="homeSearchBtn">Qidirish</button>
    </div>

    <div class="stats">
      <div class="stat"><div class="value" style="color:var(--primary)">${total}</div><div class="label">Imkoniyatlar</div></div>
      <div class="stat"><div class="value" style="color:var(--green)">${newCount}</div><div class="label">Yangi</div></div>
      <div class="stat"><div class="value" style="color:var(--purple)">${grants}</div><div class="label">Grantlar</div></div>
      <div class="stat"><div class="value" style="color:var(--orange)">${saved}</div><div class="label">Saqlangan</div></div>
    </div>

    <div class="banner">
      <div>
        <div class="small">SIZ UCHUN TAVSIYA</div>
        <h3>${interest ? esc(interest) + " sohasiga mos imkoniyatlarni toping"
                     : "Sohangizni kiriting va mos imkoniyatlarni toping"}</h3>
        <p>${interest ? "Profilingizdagi qiziqish asosida mos imkoniyatlar ajratib ko‘rsatiladi."
                     : "Masalan: Logistika, IT, Marketing yoki Iqtisodiyot."}</p>
      </div>
      <button class="btn white" id="goRec">Menga moslarini ko‘rsatish</button>
    </div>

    <div class="section-title">Yangi imkoniyatlar</div>
    <div class="section-sub">Eng so‘nggi topilgan imkoniyatlar</div>
    <div class="grid-2" id="latestGrid"></div>
  `;

  const latest = state.opportunities.slice(0, 4);
  const grid = $("#latestGrid");
  latest.forEach(item => grid.appendChild(compactCard(item)));

  $("#homeSearchBtn").onclick = () => {
    const q = $("#homeSearch").value.trim();
    if(q) searchResults(q); else navigate("opportunities");
  };
  $("#homeSearch").addEventListener("keydown", e => {
    if(e.key === "Enter") $("#homeSearchBtn").click();
  });
  $("#goRec").onclick = () => navigate("recommended");
}

function compactCard(item){
  const [color, soft] = catColors(item.category);
  const div = document.createElement("div");
  div.className = "card";
  div.innerHTML = `
    <div class="badges">
      <span class="badge" style="background:${soft};color:${color}">${esc(item.category)}</span>
      ${item.seen === false ? '<span class="badge new">YANGI</span>' : ""}
      <span class="badge deadline">⌛ ${esc(item.deadline || "—")}</span>
    </div>
    <h3>${esc(item.title)}</h3>
    <p>${esc((item.description || "").slice(0, 150))}</p>
    <button class="more">Batafsil →</button>
  `;
  div.querySelector(".more").onclick = () => showDetail(item);
  return div;
}

/* =========================================================
   RENDER: OPPORTUNITIES
   ========================================================= */
function renderOpportunities(main){
  main.innerHTML = `
    <h2 class="page-title">Imkoniyatlar</h2>
    <p class="page-sub">O‘zingizga kerakli yo‘nalishni tanlang yoki qidiruvdan foydalaning.</p>
    <div class="toolbar">
      <select id="catSelect">
        ${CATEGORIES.map(c => `<option ${c===currentCategory?"selected":""}>${c}</option>`).join("")}
      </select>
      <input id="searchInput" placeholder="Qidirish..." />
      <button class="btn" id="searchBtn">Qidirish</button>
    </div>
    <div id="listWrap"></div>
  `;

  $("#catSelect").onchange = e => {
    currentCategory = e.target.value;
    renderOpportunities(main);
  };
  $("#searchBtn").onclick = () => {
    const q = $("#searchInput").value.trim();
    if(q) searchResults(q); else renderOpportunities(main);
  };
  $("#searchInput").addEventListener("keydown", e => {
    if(e.key === "Enter") $("#searchBtn").click();
  });

  const items = currentCategory === "Barchasi"
    ? state.opportunities
    : state.opportunities.filter(x => x.category === currentCategory);

  renderList($("#listWrap"), items);
}

function renderList(container, items){
  if(!items.length){
    container.innerHTML = `<div class="empty">
      <h3>Mos imkoniyat topilmadi</h3>
      <p>Boshqa kategoriya yoki qidiruv so‘zini sinab ko‘ring.</p>
    </div>`;
    return;
  }
  container.innerHTML = "";
  items.forEach(item => container.appendChild(listCard(item)));
}

function listCard(item){
  const [color, soft] = catColors(item.category);
  const div = document.createElement("div");
  div.className = "list-card";
  div.innerHTML = `
    <div class="cat-icon" style="background:${soft};color:${color}">${catIcon(item.category)}</div>
    <div class="content">
      <div class="badges">
        <h3 style="flex:1">${esc(item.title)}</h3>
        ${item.seen === false ? '<span class="badge new">YANGI</span>' : ""}
      </div>
      <div class="meta">
        ${esc(item.location || "")} · ${esc(item.type || "")} ·
        E’lon: ${esc(ago(item.published))} · Manba: ${esc(item.source || "—")}
      </div>
      <div class="fields">Soha: ${esc((item.fields||[]).join(", "))}</div>
    </div>
    <div class="actions"><button class="btn">Batafsil →</button></div>
  `;
  div.querySelector(".btn").onclick = () => showDetail(item);
  return div;
}
